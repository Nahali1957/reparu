name: reparu

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:33070:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Paris
      MYSQL_HOST: db
      MQTT_HOST: mqtt
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - app_data:/data
      - mqtt_ca:/certs:ro

  mqtt:
    build: ./infra/mqtt
    restart: unless-stopped
    env_file: .env
    ports:
      - "8883:8883"
    volumes:
      - mqtt_certs:/mosquitto/certs
      - mqtt_ca:/mosquitto/ca-public
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /mosquitto/ca-public/ca.crt && pidof mosquitto"]
      interval: 10s
      timeout: 3s
      retries: 10

  iot-sim:
    build: ./iot-sim
    restart: unless-stopped
    env_file: .env
    environment:
      MQTT_HOST: mqtt
    depends_on:
      mqtt:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - mqtt_ca:/certs:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5180:80"

  # Vérification visuelle (hors démarrage normal) : docker compose --profile tests run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: ["tests"]
    network_mode: host
    user: "1000:1000"
    working_dir: /work
    env_file: .env
    environment:
      HOME: /tmp
      BASE_URL: ${E2E_BASE_URL:-http://localhost:5180}
    volumes:
      - ./:/work
    command: ["npx", "playwright", "test"]

volumes:
  db_data:
  app_data:
  mqtt_certs:
  mqtt_ca:
  mqtt_data:
